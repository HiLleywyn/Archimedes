# CI for the standalone Archimedes repository.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile every module
        run: python -m compileall config.py main.py framework ai cogs

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  sidecar:
    name: Build agent sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: agent-sidecar

      - name: Type-check and build
        run: npm run build
        working-directory: agent-sidecar
