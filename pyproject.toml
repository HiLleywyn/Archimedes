[project]
name = "archimedes"
version = "3.0.0"
description = "A personal-assistant application that lives in Discord -- Soul, Heartbeat, Scheduler, MCP, Dynamic UI and a multi-provider service chain on top of a Discord channel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "lupa>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
